        fill="#0f766e"/>
  <path d="M24 7.2 37.8 11.8V24c0 8-6 14.8-13.8 17.2V7.2z"
        fill="#0b5c55" opacity=".55"/>
  <rect x="15" y="25" width="4.6" height="8"  rx="1.2" fill="#ffffff" opacity=".95"/>
  <rect x="21.7" y="20.5" width="4.6" height="12.5" rx="1.2" fill="#ffffff" opacity=".95"/>
  <rect x="28.4" y="16" width="4.6" height="17" rx="1.2" fill="#ffffff" opacity=".95"/>
</svg>
