<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="GradeVault">
  <title>GradeVault</title>
  <!-- A shield: records held safely. Inside, three rising bars for
       results improving over terms. Drawn as plain shapes so it stays
       sharp at any size and costs almost nothing to download. -->
