# Deployment blueprint.
#
# Describes the service and its database as a file in the repository, so
# the deployment is reviewable and reproducible rather than a set of
# settings someone once clicked into a dashboard.

services:
  - type: web
    name: gradevault
    runtime: python
    plan: free
    region: frankfurt          # closest available region to Somalia
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60

    # Asks only whether the process is up and can reach its database.
    # Pointing this at /login/ made the health of the service depend on
    # sessions, the sign-in limiter and template rendering, so a broken
    # template would have taken the site down for an unrelated reason.
    healthCheckPath: /healthz

    envVars:
      # Generated once by the platform and never seen by anyone. This is
      # why settings.py refuses to start without it rather than falling
      # back to a default.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      # Optional. Django already trusts RENDER_EXTERNAL_HOSTNAME, which
      # the platform sets, so the first deploy serves without anyone
      # entering anything. Set this only when a custom domain is added.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false

      # This deployment is the public demo: seeded with fictional data
      # and refusing every write. See accounts/demo.py.
      - key: DEMO_MODE
        value: "True"

      - key: DATABASE_URL
        fromDatabase:
          name: gradevault-db
          property: connectionString

      - key: PYTHON_VERSION
        value: "3.13.13"

databases:
  - name: gradevault-db
    plan: free
    databaseName: gradevault
    user: gradevault

    # Must match the web service's region above.
    #
    # DATABASE_URL is wired to this database's *internal* connection
    # string, and Render's internal network does not cross regions. Left
    # unset, this block defaulted to Oregon while the service sat in
    # Frankfurt, so the service could not reach its own database: the
    # first deploy failed at `migrate`, and the pair looked correctly
    # configured in every file that described them separately.
    region: frankfurt
